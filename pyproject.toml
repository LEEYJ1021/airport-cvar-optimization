[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-cvar-optimization"
version = "1.0.0"
description = "Tail-risk-aware real-time optimization for Incheon Airport departures."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Your Name", email = "you@example.com"}
]
dependencies = [
  "alembic==1.13.2",
  "click==8.1.7",
  "colorlog==6.8.0",
  "croniter==2.0.3",
  "matplotlib==3.9.0",
  "numpy==1.26.4",
  "openpyxl==3.1.5",
  "pandas==2.2.2",
  "plotly==5.20.0",
  "python-dotenv==1.0.1",
  "PyMySQL==1.1.1",
  "pyyaml==6.0.1",
  "requests==2.32.3",
  "scipy==1.11.4",
  "seaborn==0.13.2",
  "SQLAlchemy==2.0.30",
  "statsmodels==0.14.2",
  "tabulate==0.9.0",
  "tenacity==8.3.0",
  "typer==0.12.3",
  "xmltodict==0.13.0"
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (requires DB)",
]